spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
logging:
  level:
    root: WARN
    com.helpinghands: INFO
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
