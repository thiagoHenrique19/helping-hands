spring:
  application:
    name: helping-hands
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpinghands}
    username: ${DB_USER:helpinghands}
    password: ${DB_PASSWORD:helpinghands}
    hikari:
      connection-init-sql: SET lock_timeout = ${app.database.lock-timeout-ms}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
app:
  database:
    # how long a writer waits for a row lock before the request fails with 409
    lock-timeout-ms: ${DB_LOCK_TIMEOUT_MS:5000}
  security:
    jwt:
      # Local/dev default only. hmg and prod profiles require JWT_SECRET.
      secret: ${JWT_SECRET:local-development-only-secret-change-me-0123456789}
      ttl: 1h
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: helping-hands
    description: Platform connecting NGOs, volunteers and donors
