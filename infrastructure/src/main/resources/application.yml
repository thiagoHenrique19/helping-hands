spring:
  application:
    name: helping-hands
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpinghands}
    username: ${DB_USER:helpinghands}
    password: ${DB_PASSWORD:helpinghands}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: helping-hands
    description: Platform connecting NGOs, volunteers and donors
