services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helpinghands
      POSTGRES_USER: helpinghands
      POSTGRES_PASSWORD: helpinghands
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpinghands -d helpinghands"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: hmg
      DB_URL: jdbc:postgresql://postgres:5432/helpinghands
      DB_USER: helpinghands
      DB_PASSWORD: helpinghands
      JWT_SECRET: ${JWT_SECRET:-compose-local-secret-change-me-0123456789abcdef}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

volumes:
  postgres-data:
